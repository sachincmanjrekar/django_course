<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog Home Page</title>
    </head>
    <body>
        {% if posts %}
            <h1>Blog Posts</h1>
                    {% for post in posts %}
            <div>
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
            </div>
        {% endfor %}
        {% else %}
            <h1>No posts available.</h1>
        {% endif %}

    </body>
</html>
